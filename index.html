<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6c4cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>発音バトル</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div><span class="eyebrow">5 LANGUAGES · 1 DEVICE</span><h1>発音バトル</h1></div>
      <button id="statsButton" class="icon-button" aria-label="成績を見る">📊</button>
    </header>

    <section id="setupScreen" class="screen active">
      <div class="hero-card">
        <div class="orb">🎙️</div>
        <h2>声で勝負しよう</h2>
        <p>お題を聞いて発音。2人で交互に挑戦し、合計点を競います。</p>
      </div>
      <label>プレイヤー1<input id="player1" value="プレイヤー1" maxlength="12"></label>
      <label>プレイヤー2<input id="player2" value="プレイヤー2" maxlength="12"></label>
      <fieldset>
        <legend>出題する言語</legend>
        <div id="languageChoices" class="language-grid"></div>
      </fieldset>
      <label>1人あたりの問題数
        <select id="roundCount"><option value="3">3問</option><option value="5" selected>5問</option><option value="8">8問</option></select>
      </label>
      <button id="startButton" class="primary">バトル開始</button>
    </section>

    <section id="battleScreen" class="screen">
      <div class="battle-top">
        <div id="turnBadge" class="turn-badge"></div><div id="progress"></div>
      </div>
      <div class="scoreboard">
        <div><strong id="name1"></strong><span id="score1">0</span></div>
        <div class="versus">VS</div>
        <div><strong id="name2"></strong><span id="score2">0</span></div>
      </div>
      <article class="question-card">
        <div id="languageLabel" class="language-label"></div>
        <div id="categoryLabel" class="category-label"></div>
        <p id="prompt" class="prompt"></p>
        <p id="reading" class="reading"></p>
        <p id="meaning" class="meaning"></p>
        <button id="listenButton" class="secondary">🔊 お手本を聞く</button>
      </article>
      <div id="recordArea" class="record-area">
        <button id="recordButton" class="record-button"><span>●</span> 録音して発音</button>
        <p id="recordStatus">ボタンを押して、表示された言葉を発音してください</p>
        <audio id="playback" controls hidden></audio>
      </div>
      <div id="resultCard" class="result-card" hidden>
        <div id="scoreRing" class="score-ring"><strong id="roundScore">0</strong><small>点</small></div>
        <div><h3 id="feedbackTitle"></h3><p id="recognizedText"></p><p id="feedback"></p></div>
      </div>
      <button id="nextButton" class="primary" hidden>次の挑戦へ</button>
      <button id="manualButton" class="text-button">認識できない場合は手動採点</button>
    </section>

    <section id="finishScreen" class="screen">
      <div class="trophy">🏆</div><h2 id="winnerText"></h2>
      <div id="finalScores" class="final-scores"></div>
      <div id="weakSummary" class="summary-card"></div>
      <button id="rematchButton" class="primary">もう一度対戦</button>
    </section>

    <dialog id="statsDialog">
      <button id="closeStats" class="dialog-close">×</button><h2>これまでの成績</h2>
      <div id="statsContent"></div>
      <button id="clearStats" class="danger">記録を消去</button>
    </dialog>

    <dialog id="manualDialog">
      <h2>手動採点</h2><p>聞こえた発音を0〜100点で評価してください。</p>
      <input id="manualScore" type="range" min="0" max="100" value="70"><output id="manualOutput">70点</output>
      <div class="dialog-actions"><button id="cancelManual" class="secondary">戻る</button><button id="saveManual" class="primary">決定</button></div>
    </dialog>
  </main>
  <script src="app.js"></script>
</body>
</html>
